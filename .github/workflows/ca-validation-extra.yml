    - name: Verify exact product source
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        actual=$(gh api "repos/${{ matrix.image_repo }}/actions/runs/${{ matrix.image_run }}" --jq .head_sha)
        test "$actual" = "$PRODUCT_SHA"
    - name: Download exact-source CI image
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        repository: ${{ matrix.image_repo }}
        run-id: ${{ matrix.image_run }}
        name: backend-image
        github-token: ${{ github.token }}
    - name: Load verified image
      run: |
        docker load < backend-image.tar.gz
        docker tag artifact-keeper-backend:pr-test artifact-keeper-backend:test
        docker tag artifact-keeper-backend:test artifact-keeper-backend:conda-fixed
    - name: Verify image and corrected head contain identical backend sources
      run: |
        git fetch --no-tags origin 70bebdc54a7ed50c9c86a9015f19d6439f6634ef
        git diff --exit-code 70bebdc54a7ed50c9c86a9015f19d6439f6634ef HEAD -- backend Cargo.toml Cargo.lock rust-toolchain.toml docker
    - name: Download legacy PR image for retained-database upgrade
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: backend-image
        run-id: 42065906002
        repository: imanlotfimahyari/artifact-keeper
        github-token: ${{ github.token }}
        path: legacy-image
    - name: Load legacy image
      run: |
        docker load < legacy-image/backend-image.tar.gz
        docker tag artifact-keeper-backend:pr-test artifact-keeper-backend:conda-legacy
    - name: Run strict native validation
      run: |
        set -euo pipefail
        mkdir -p reports .pki
        set -a
        . ./.env.test
        set +a
        bash scripts/pki/generate-certs.sh .pki > reports/pki.log 2>&1
        bash scripts/pki/generate-gpg.sh .pki >> reports/pki.log 2>&1
        if [ "$PROFILE" = curation ]; then
          bash scripts/native-tests/prepare-curation-fixture.sh >> reports/pki.log 2>&1
        fi
        if [ "$PROFILE" = terraform-mirror ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -keyout .pki/ca.key -out .pki/ca.crt -days 2 -subj '/CN=Native validation CA' > reports/tls.log 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout .pki/server.key -out .pki/server.csr -subj '/CN=native.test' >> reports/tls.log 2>&1
          printf 'subjectAltName=DNS:native.test\nextendedKeyUsage=serverAuth\n' > .pki/ext.cnf
          openssl x509 -req -in .pki/server.csr -CA .pki/ca.crt -CAkey .pki/ca.key -CAcreateserial -out .pki/server.crt -days 2 -extfile .pki/ext.cnf >> reports/tls.log 2>&1
          cat > tls.conf <<'NGINX'
        server { listen 8443 ssl; server_name native.test; ssl_certificate /fixture/server.crt; ssl_certificate_key /fixture/server.key; location / { proxy_pass http://backend:8080; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto https; } }
        NGINX
        fi
        docker compose -f docker-compose.test.yml --profile all --profile "$PROFILE" config --format json > source-compose.json
        cat > configure.py <<'CONFIG'
        import json,os
        from pathlib import Path
        c=json.loads(Path('source-compose.json').read_text());s=c['services'];b=s['backend'];b.pop('build',None)
        b['ports']=[{'target':8080,'published':'18080','host_ip':'127.0.0.1','protocol':'tcp'}]
        for name,v in list(b['networks'].items()):
         v=v or {};v.setdefault('aliases',[]).append('backend.test');b['networks'][name]=v
        for name,v in s.items():
         if name.endswith('-test'):
          env=v.setdefault('environment',{})
          for k in ('ADMIN_PASS','ADMIN_PASSWORD','AK_TEST_ADMIN_PASSWORD'):env[k]=os.environ[k]
          if 'REGISTRY_URL' in env:env['REGISTRY_URL']='http://backend.test:8080'
        s['hex-test']['environment']['HEX_REPO_KEY']='ci-hex'
        s['hex-test']['image']='elixir:1.19-alpine'
        s['protobuf-test']['environment']['REPO_KEY']='ci-protobuf'
        for name in ('hex','protobuf'):
         s[name+'-test']['command']=['sh','-c',f'apk add --no-cache bash curl jq tar coreutils python3 openssl perl-utils >/dev/null 2>&1 && bash /scripts/test-{name}.sh']
        s['conda-test']['environment'].update({'BACKEND_URL':'http://backend.test:8080','AUTH_USER':'admin','AUTH_PASS':os.environ['ADMIN_PASS']})
        s['conda-test']['command']=['bash','-c','apt-get update -qq && apt-get install -y -qq --no-install-recommends curl jq zip unzip bzip2 zstd openssl >/dev/null && bash /scripts/test-conda.sh']
        if 'mock-upstream' in s:
         s['mock-upstream']['healthcheck']['test']=['CMD','wget','-q','--spider','http://127.0.0.1/rpm/repodata/repomd.xml']
         s['mock-upstream']['networks']={'e2e-test-network':{'aliases':['mock-upstream.test']}}
         s['curation-test']['environment']['MOCK_UPSTREAM_URL']='http://mock-upstream.test'
         s['curation-test']['environment']['CURATION_GPG_KEY']='/fixture/gpg-signing.pub'
         s['curation-test'].setdefault('volumes',[]).append({'type':'bind','source':str(Path('.pki/gpg-signing.pub').resolve()),'target':'/fixture/gpg-signing.pub','read_only':True})
        if os.environ['PROFILE']=='terraform-mirror':
         s['tls-fixture']={'image':'nginx:alpine','volumes':[str(Path('.pki').resolve())+':/fixture:ro',str(Path('tls.conf').resolve())+':/etc/nginx/conf.d/default.conf:ro'],'networks':{'e2e-test-network':{'aliases':['native.test']}},'depends_on':{'backend':{'condition':'service_healthy'}}}
         v=s['terraform-mirror-test'];v['environment'].update({'REGISTRY_URL':'https://native.test:8443','SSL_CERT_FILE':'/fixture/ca.crt','CURL_CA_BUNDLE':'/fixture/ca.crt','RUN_TERRAFORM_CLI':'1'})
         v.setdefault('volumes',[]).append({'type':'bind','source':str(Path('.pki').resolve()),'target':'/fixture','read_only':True})
         v.setdefault('depends_on',{})['tls-fixture']={'condition':'service_started'}
        Path('validation-compose.json').write_text(json.dumps(c))
        CONFIG
        python3 configure.py

        python3 -m venv /tmp/conda-upgrade-venv
        /tmp/conda-upgrade-venv/bin/pip -q install msgpack zstandard
        cat > conda-upgrade.py <<'UPGRADE'
        """Synthetic hosted/synthesized CEP-16 upgrade regression using real stored shards."""
        import os,json,io,tarfile,hashlib,urllib.request,urllib.error,time,sys,subprocess
        from pathlib import Path
        import zstandard,msgpack
        BASE='http://127.0.0.1:18080';TOKEN=None

        def req(method,path,data=None):
         h={}
         if TOKEN:h['Authorization']='Bearer '+TOKEN
         if isinstance(data,dict):data=json.dumps(data).encode();h['Content-Type']='application/json'
         r=urllib.request.Request(BASE+path,data=data,headers=h,method=method)
         with urllib.request.urlopen(r,timeout=30) as f:return f.read()

        def repo(key,typ,**kw):
         req('POST','/api/v1/repositories',dict(key=key,name='Synthetic Conda upgrade',format='conda',repo_type=typ,is_public=True,**kw))

        def unzstd(data):
         with zstandard.ZstdDecompressor().stream_reader(io.BytesIO(data)) as r:return r.read(5*1024*1024)

        def wire(key):
         prefix='/conda/'+key+'/noarch/'
         index=msgpack.unpackb(unzstd(req('GET',prefix+'repodata_shards.msgpack.zst')),raw=False)
         digest=index['shards']['upgrade-fixture'];assert isinstance(digest,bytes) and len(digest)==32
         url=urllib.parse.urljoin(BASE+prefix,index['info']['shards_base_url']+digest.hex()+'.msgpack.zst')
         data=req('GET',url.removeprefix(BASE));assert hashlib.sha256(data).digest()==digest
         return msgpack.unpackb(unzstd(data),raw=False)

        def verify(legacy):
         for key in ('upgrade-hosted','upgrade-virtual','upgrade-remote'):
          records=wire(key)['packages'];assert len(records)==1,(key,len(records))
          record=next(iter(records.values()));assert ('fn' in record)==legacy,(key,record)
          assert record['name']=='upgrade-fixture' and record['version']=='1.0.0'
         print('PASS: '+('legacy' if legacy else 'compatible')+' hosted, virtual and synthesized wire records',flush=True)

        TOKEN=json.loads(req('POST','/api/v1/auth/login',dict(username='admin',password=os.environ['ADMIN_PASS'])))['access_token']
        if sys.argv[1]=='seed':
         repo('upgrade-hosted','local')
         info=dict(name='upgrade-fixture',version='1.0.0',build='0',build_number=0,subdir='noarch',noarch='generic',depends=[])
         package=io.BytesIO()
         with tarfile.open(fileobj=package,mode='w:bz2') as t:
          for n,b in [('info/index.json',json.dumps(info).encode()),('info/files',b'share/fixture.txt\n'),('share/fixture.txt',b'synthetic upgrade fixture\n')]:
           ti=tarfile.TarInfo(n);ti.size=len(b);t.addfile(ti,io.BytesIO(b))
         req('PUT','/conda/upgrade-hosted/noarch/upgrade-fixture-1.0.0-0.tar.bz2',package.getvalue())
         repo('upgrade-virtual','virtual')
         req('POST','/api/v1/repositories/upgrade-virtual/members',dict(member_key='upgrade-hosted',priority=1))
         upstream=Path('reports/conda-upstream/noarch');upstream.mkdir(parents=True,exist_ok=True)
         (upstream/'repodata.json').write_bytes(req('GET','/conda/upgrade-hosted/noarch/repodata.json'))
         subprocess.run(['docker','run','-d','--name','conda-upstream','--network','e2e-test-network','--network-alias','conda-fixture.test','-v',str(upstream.parent.resolve())+':/usr/share/nginx/html:ro','nginx:alpine'],check=True,stdout=subprocess.DEVNULL)
         repo('upgrade-remote','remote',upstream_url='http://conda-fixture.test')
         verify(True)
         stored=subprocess.check_output(['docker','compose','-f','validation-compose.json','exec','-T','postgres','psql','-U','registry','-d','artifact_registry','-Atc',"SELECT COUNT(*) FROM conda_shard_index s JOIN repositories r ON r.id=s.repository_id WHERE r.key IN ('upgrade-hosted','upgrade-remote') AND s.shard IS NOT NULL"],text=True).strip()
         assert int(stored)>=2,stored
         print('PASS: old stored hosted and synthesized shards exist before upgrade',flush=True)
        else:
         verify(False)
         for _ in range(60):
          pending=subprocess.check_output(['docker','compose','-f','validation-compose.json','exec','-T','postgres','psql','-U','registry','-d','artifact_registry','-Atc',"SELECT COUNT(*) FROM conda_channel_state c JOIN repositories r ON r.id=c.repository_id WHERE r.key='upgrade-hosted' AND c.backfill_done_at IS NULL"],text=True).strip()
          if pending=='0':break
          time.sleep(1)
         else:raise AssertionError('bounded hosted backfill did not complete')
         verify(False)
         encoded=subprocess.check_output(['docker','compose','-f','validation-compose.json','exec','-T','postgres','psql','-U','registry','-d','artifact_registry','-Atc',"SELECT encode(s.shard,'hex') FROM conda_shard_index s JOIN repositories r ON r.id=s.repository_id WHERE r.key IN ('upgrade-hosted','upgrade-remote') AND s.shard IS NOT NULL"],text=True).splitlines()
         assert len(encoded)==2,len(encoded)
         for hex_body in encoded:
          document=msgpack.unpackb(unzstd(bytes.fromhex(hex_body)),raw=False)
          for section in ('packages','packages.conda'):
           for record in document[section].values():assert 'fn' not in record
         print('PASS: persisted hosted and synthesized shards were re-encoded',flush=True)
         print('PASS: migration and bounded backfill completed on pre-existing catalog',flush=True)
        UPGRADE
        cat > conda-client.py <<'CLIENT'
        import subprocess,json,sys
        from pathlib import Path
        legacy=sys.argv[1]=='legacy'
        for key in ('upgrade-hosted','upgrade-virtual','upgrade-remote'):
         args=['docker','run','--rm','--network','e2e-test-network','continuumio/miniconda3:latest','conda','search','--json','--override-channels','-c','http://backend.test:8080/conda/'+key,'upgrade-fixture']
         result=subprocess.run(args,text=True,capture_output=True,timeout=120)
         Path('reports/'+sys.argv[1]+'-native-'+key+'.log').write_text(result.stdout+result.stderr)
         if legacy:
          assert result.returncode!=0 and 'multiple values' in result.stdout+result.stderr and "'fn'" in result.stdout+result.stderr,(key,result.returncode)
         else:
          assert result.returncode==0,(key,result.returncode,result.stderr[-300:])
          data=json.loads(result.stdout);assert any(r['version']=='1.0.0' for r in data['upgrade-fixture'])
        print('PASS: native Conda '+('reproduces legacy duplicate fn' if legacy else 'search succeeds after retained-database upgrade'))
        CLIENT
        docker pull nginx:alpine > reports/fixture-image.log 2>&1
        docker pull continuumio/miniconda3:latest >> reports/fixture-image.log 2>&1
        docker tag artifact-keeper-backend:conda-legacy artifact-keeper-backend:test
        docker compose -f validation-compose.json up -d --no-build --wait --wait-timeout 180 postgres backend > reports/legacy-start.log 2>&1
        /tmp/conda-upgrade-venv/bin/python conda-upgrade.py seed > reports/upgrade.log 2>&1
        python3 conda-client.py legacy >> reports/upgrade.log 2>&1
        docker logs e2e-test-backend > reports/legacy-backend.log 2>&1
        # Stop all older writers; retain the running PostgreSQL and storage volumes.
        docker compose -f validation-compose.json stop backend >> reports/legacy-start.log 2>&1
        docker tag artifact-keeper-backend:conda-fixed artifact-keeper-backend:test
        docker compose -f validation-compose.json up -d --no-deps --force-recreate --no-build --wait --wait-timeout 180 backend > reports/upgrade-start.log 2>&1
        /tmp/conda-upgrade-venv/bin/python conda-upgrade.py verify >> reports/upgrade.log 2>&1
        python3 conda-client.py fixed >> reports/upgrade.log 2>&1
        docker compose -f validation-compose.json exec -T postgres psql -U registry -d artifact_registry -Atc 'SELECT version, success FROM _sqlx_migrations WHERE version=332' > reports/migration-332.txt
        grep -Fx '332|t' reports/migration-332.txt

        cat > strict-native.py <<'STRICT'
        import os,json,time,hashlib,urllib.request,urllib.error,subprocess,tempfile,pathlib,zipfile,io
        BASE='http://127.0.0.1:18080';TOKEN=None;ROOT=pathlib.Path.cwd();PROFILE=os.environ['PROFILE']
        def api(method,path,data=None,headers=None):
         h=dict(headers or {})
         if TOKEN:h['Authorization']='Bearer '+TOKEN
         if isinstance(data,dict):data=json.dumps(data).encode();h['Content-Type']='application/json'
         r=urllib.request.Request(BASE+path,data=data,headers=h,method=method)
         try:
          with urllib.request.urlopen(r,timeout=30) as f:return f.status,f.read()
         except urllib.error.HTTPError as e:return e.code,e.read()
        def ok(method,path,data=None,headers=None):
         code,body=api(method,path,data,headers)
         assert 200<=code<300,(method,path,code,body[:180])
         return body
        def cmd(args,**kw):
         r=subprocess.run(args,text=True,capture_output=True,**kw)
         if r.returncode:
          print(r.stdout[-4000:],flush=True);print(r.stderr[-4000:],flush=True)
          raise RuntimeError('native command failed: '+args[0]+' exit='+str(r.returncode))
         return r.stdout
        for _ in range(90):
         try:
          if api('GET','/health')[0]==200:break
         except OSError:pass
         time.sleep(1)
        else:raise AssertionError('backend readiness timed out')
        TOKEN=json.loads(ok('POST','/api/v1/auth/login',{'username':'admin','password':os.environ['ADMIN_PASS']}))['access_token']
        key='strict-'+PROFILE
        fmt={'deb':'debian','rpm':'rpm','go':'go','helm':'helm'}[PROFILE]
        ok('POST','/api/v1/repositories',{'key':key,'name':'Synthetic '+PROFILE,'format':fmt,'repo_type':'local','is_public':True})
        with tempfile.TemporaryDirectory() as td:
         d=pathlib.Path(td);d.chmod(0o755)
         if PROFILE=='go':
          module='example.com/ca-native-fixture';version='v1.0.0'
          gomod=b'module example.com/ca-native-fixture\n\ngo 1.20\n'
          source=b'package fixture\nfunc Message() string { return "ca-native-fixture" }\n'
          buf=io.BytesIO()
          with zipfile.ZipFile(buf,'w') as z:
           z.writestr(module+'@'+version+'/go.mod',gomod);z.writestr(module+'@'+version+'/fixture.go',source)
          path='/go/'+key+'/'+module+'/@v/'+version
          ok('PUT',path+'.mod',gomod);ok('PUT',path+'.zip',buf.getvalue())
          assert ok('GET',path+'.zip')==buf.getvalue()
          assert json.loads(ok('GET',path+'.info'))['Version']==version
          (d/'go.mod').write_text('module consumer.example\n\ngo 1.20\n')
          (d/'main.go').write_text('package main\nimport ("fmt"; f "example.com/ca-native-fixture")\nfunc main(){fmt.Print(f.Message())}\n')
          env=dict(os.environ,GOPROXY=BASE+'/go/'+key,GOSUMDB='off',GOPRIVATE='',GONOPROXY='',GOMODCACHE=str(d/'cache'),GOWORK='off')
          cmd(['go','get',module+'@'+version],cwd=d,env=env)
          assert cmd(['go','run','.'],cwd=d,env=env)=='ca-native-fixture'
          print('PASS: strict Go upload, proxy download and compiled native consumer')
         elif PROFILE=='helm':
          chart=d/'ca-native-chart';(chart/'templates').mkdir(parents=True)
          (chart/'Chart.yaml').write_text('apiVersion: v2\nname: ca-native-chart\nversion: 1.0.0\n')
          (chart/'templates'/'config.yaml').write_text('apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: fixture\n')
          cmd(['helm','package',str(chart),'--destination',str(d)])
          package=d/'ca-native-chart-1.0.0.tgz'
          cmd(['curl','-fsS','-H','Authorization: Bearer '+TOKEN,'-F','chart=@'+str(package),BASE+'/helm/'+key+'/api/charts'])
          env=dict(os.environ,HELM_CONFIG_HOME=str(d/'config'),HELM_CACHE_HOME=str(d/'cache'),HELM_DATA_HOME=str(d/'data'))
          cmd(['helm','repo','add','fixture',BASE+'/helm/'+key],env=env)
          cmd(['helm','repo','update'],env=env)
          (d/'download').mkdir();cmd(['helm','pull','fixture/ca-native-chart','--version','1.0.0','--destination',str(d/'download')],env=env)
          assert (d/'download'/package.name).read_bytes()==package.read_bytes()
          assert 'version: 1.0.0' in cmd(['helm','show','chart',str(d/'download'/package.name)],env=env)
          print('PASS: strict Helm package, ChartMuseum upload, native index/pull and byte equality')
         elif PROFILE=='rpm':
          p=ROOT/'backend/tests/fixtures/ak-meta-test-1.0-1.noarch.rpm'
          ok('PUT','/rpm/'+key+'/packages/'+p.name,p.read_bytes(),{'Content-Type':'application/x-rpm'})
          assert ok('GET','/rpm/'+key+'/packages/'+p.name)==p.read_bytes()
          for _ in range(60):
           c,b=api('GET','/rpm/'+key+'/repodata/repomd.xml')
           if c==200 and b'repomd' in b:break
           time.sleep(1)
          else:raise AssertionError('RPM repodata unavailable')
          network=json.loads(cmd(['docker','inspect','e2e-test-backend']))[0]['NetworkSettings']['Networks']
          net=next(iter(network))
          script='set -e; dnf -q -y install --allowerasing dnf-plugins-core >/dev/null; dnf -q --repofrompath=fixture,http://backend.test:8080/rpm/'+key+' --disablerepo="*" --enablerepo=fixture --setopt=fixture.gpgcheck=0 repoquery --qf "%{name}-%{version}" | grep -Fx ak-meta-test-1.0'
          output=cmd(['docker','run','--rm','--network',net,'rockylinux/rockylinux:9','bash','-c',script]);assert 'ak-meta-test-1.0' in output
          print('PASS: strict RPM fixture upload/download, repodata and native DNF repoquery (unsigned test fixture)')
         elif PROFILE=='deb':
          pkg=d/'pkg';(pkg/'DEBIAN').mkdir(parents=True);(pkg/'usr/share/ca-native-deb').mkdir(parents=True)
          (pkg/'DEBIAN/control').write_text('Package: ca-native-deb\nVersion: 1.0.0\nArchitecture: all\nMaintainer: Test <test@example.com>\nDescription: synthetic validation package\n')
          (pkg/'usr/share/ca-native-deb/data').write_text('synthetic fixture\n')
          package=d/'ca-native-deb_1.0.0_all.deb';cmd(['dpkg-deb','--build','--root-owner-group',str(pkg),str(package)])
          path='/debian/'+key+'/pool/main/c/ca-native-deb/'+package.name
          ok('PUT',path,package.read_bytes(),{'Content-Type':'application/vnd.debian.binary-package'})
          assert ok('GET',path)==package.read_bytes()
          lists=d/'lists';(lists/'partial').mkdir(parents=True);cache=d/'apt-cache';(cache/'archives/partial').mkdir(parents=True)
          sources=d/'sources.list';sources.write_text('deb [trusted=yes] '+BASE+'/debian/'+key+' stable main\n')
          parts=d/'parts';parts.mkdir()
          opts=['-o','Dir::Etc::sourcelist='+str(sources),'-o','Dir::Etc::sourceparts='+str(parts),'-o','Dir::State::lists='+str(lists),'-o','Dir::Cache='+str(cache),'-o','APT::Get::List-Cleanup=0']
          cmd(['apt-get',*opts,'update']);(d/'download').mkdir();cmd(['apt-get',*opts,'download','ca-native-deb=1.0.0'],cwd=d/'download')
          assert (d/'download'/package.name).read_bytes()==package.read_bytes()
          print('PASS: strict DEB build/upload, native APT metadata/download and byte equality (unsigned test fixture)')
        STRICT
        if [[ "$PROFILE" =~ ^(go|helm|rpm|deb)$ ]]; then
          docker compose -f validation-compose.json up -d --no-build --wait --wait-timeout 180 postgres backend > reports/start.log 2>&1
          if [ "$PROFILE" = helm ]; then
            curl -fsSL https://get.helm.sh/helm-v3.17.4-linux-amd64.tar.gz -o /tmp/native-helm.tgz
            tar -xzf /tmp/native-helm.tgz -C /tmp
            export PATH=/tmp/linux-amd64:$PATH
          fi
          timeout 720 python3 strict-native.py > reports/test.log 2>&1
        else
          target="${PROFILE}-test"
          docker compose -f validation-compose.json up -d --no-build --wait --wait-timeout 180 trivy setup pki > reports/start.log 2>&1
          cat > bootstrap.py <<'BOOTSTRAP'
        import json,os,urllib.request,urllib.error
        base='http://127.0.0.1:18080'
        def api(method,path,obj=None,token=None):
         h={'Content-Type':'application/json'}
         if token:h['Authorization']='Bearer '+token
         req=urllib.request.Request(base+path,data=json.dumps(obj).encode() if obj else None,headers=h,method=method)
         try:
          with urllib.request.urlopen(req,timeout=20) as f:return f.status,json.load(f)
         except urllib.error.HTTPError as e:return e.code,e.read().decode()[:160]
        code,body=api('POST','/api/v1/auth/login',{'username':'admin','password':os.environ['ADMIN_PASS']});assert code==200,code
        token=body['access_token']
        if os.environ['PROFILE']=='hex':
         code,body=api('POST','/api/v1/repositories',{'key':'ci-hex','name':'Synthetic Hex fixture','format':'hex','repo_type':'local','is_public':True},token)
         assert 200<=code<300,(code,body)
         code,body=api('GET','/api/v1/repositories/ci-hex',token=token)
         assert code==200 and body['format']=='hex',(code,body)
         print('Verified Hex fixture format and visibility')
        BOOTSTRAP
          python3 bootstrap.py > reports/bootstrap.log 2>&1
          docker compose -f validation-compose.json up -d --no-build "$target" >> reports/start.log 2>&1
          container="e2e-test-$PROFILE"
          timeout 720 docker wait "$container" > reports/wait.log
          docker logs "$container" > reports/test.log 2>&1
          state=$(docker inspect --format '{{.State.Status}} {{.State.ExitCode}} {{.State.OOMKilled}}' "$container")
          echo "$state" > reports/exit-state.txt
          [ "$state" = 'exited 0 false' ]
        fi
        echo "PASS: $MODE $PROFILE product=$PRODUCT_SHA" | tee reports/result.txt
    - name: Collect diagnostic output
      if: always()
      run: |
        mkdir -p reports
        if [ -f validation-compose.json ]; then docker compose -f validation-compose.json logs --no-color > reports/stack.log 2>&1 || true; fi
        docker ps -a > reports/containers.txt
    - name: Upload profile evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: conda-native-and-upgrade-${{ matrix.product_sha }}
        path: reports
        retention-days: 7
    - name: Clean isolated stack
      if: always()
      run: |
        docker rm -f conda-upstream 2>/dev/null || true
        if [ -f validation-compose.json ]; then docker compose -f validation-compose.json down -v --remove-orphans; fi
  shell-gates:
    name: Complete shell gates on corrected Conda branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: 3f72c6e2589c95dfa422a76483fcab9ee1b49c50
        persist-credentials: false
    - name: Fetch the base ref
      if: ${{ github.event_name == 'pull_request' }}
      run: git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
    - name: dtrack-init regression test
      run: bash docker/test-init-dtrack.sh
    - name: Check the stock compose ships no secret the backend rejects
