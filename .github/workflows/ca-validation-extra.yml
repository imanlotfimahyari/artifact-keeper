        \ \n # conda search\n log \"Running conda search...\"\n-if conda search \"e2e-v1-pkg\" --override-channels -c \"$BACKEND_URL/conda/$REPO_KEY\"\
        \ 2>&1 | grep -q \"$TEST_VERSION\"; then\n+if conda_search_fixture --override-channels -c \"$BACKEND_URL/conda/$REPO_KEY\"\
        ; then\n     pass \"2.9: conda search finds package with correct version\"\n else\n     fail \"2.9: conda search did\
        \ not find package\"\n@@ -527,7 +544,7 @@ echo \"  Section 11: Client Compatibility\"\n echo \"=============================================\"\
        \n \n # conda search\n-if conda search \"e2e-v1-pkg\" --override-channels -c \"$BACKEND_URL/conda/$REPO_KEY\" 2>&1\
        \ | grep -q \"e2e-v1-pkg\"; then\n+if conda_search_fixture --override-channels -c \"$BACKEND_URL/conda/$REPO_KEY\"\
        ; then\n     pass \"11.3: conda search returns correct results\"\n else\n     fail \"11.3: conda search did not find\
        \ package\"\n@@ -550,23 +567,16 @@ fi\n \n # .condarc URL format\n log \"Testing .condarc channel URL format...\"\n\
        -CONDARC_TEST=\"$WORK_DIR/.condarc-test\"\n+CONDARC_TEST=\"$WORK_DIR/.condarc\"\n cat > \"$CONDARC_TEST\" << EOF\n\
        \ channels:\n   - $BACKEND_URL/conda/$REPO_KEY\n-  - defaults\n+default_channels: []\n EOF\n-if CONDARC=\"$CONDARC_TEST\"\
