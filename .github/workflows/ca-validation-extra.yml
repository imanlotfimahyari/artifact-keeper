name: PR 5194 extended validation
'on':
  push:
    branches:
    - validation/5194-extra-hosted
    paths:
    - .github/workflows/ca-validation-extra.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: ca-5194-extended-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  image:
    name: Wait for exact-head CI image
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
    - name: Verify source and wait for image
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        expected="7f7345abb9998e74d3c4c80ba1da86e80ebb01a0"
        actual=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/42022451713" --jq .head_sha)
        [ "$actual" = "$expected" ]
        for attempt in $(seq 1 90); do
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/42022451713/artifacts" --jq '[.artifacts[] | select(.name == "backend-image" and .expired == false)] | length')
          if [ "$count" = 1 ]; then echo "Verified backend image artifact for $expected"; exit 0; fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/42022451713" --jq .status)
          [ "$status" != completed ] || { echo 'CI finished without backend image'; exit 1; }
          sleep 30
        done
        echo 'Timed out waiting for the exact-head image'; exit 1
  extended:
    name: Extended (${{ matrix.profiles }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        profiles:
        - maven
        - conda
        - hex
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 7f7345abb9998e74d3c4c80ba1da86e80ebb01a0
        persist-credentials: false
    - name: Download exact-head backend image
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: backend-image
        run-id: 42022451713
        github-token: ${{ github.token }}
    - name: Load tested image
      run: |
        docker load < backend-image.tar.gz
        docker tag artifact-keeper-backend:pr-test artifact-keeper-backend:test
    - name: Native client suites, inspect every exit status
      if: matrix.profiles != 'recovery'
      env:
        PROFILES: ${{ matrix.profiles }}
      run: |
        set -euo pipefail
        mkdir -p validation-reports
        set -a
        . ./.env.test
        set +a
        bash scripts/pki/generate-certs.sh .pki > validation-reports/pki.log 2>&1
        bash scripts/pki/generate-gpg.sh .pki >> validation-reports/pki.log 2>&1
        failed=0
        for profile in $PROFILES; do
          targets="${profile}-test"
          containers="e2e-test-${profile}"
          if [ "$profile" = cache-correctness ]; then
            targets="cache-correctness-test virtual-resolution-test"
            containers="e2e-test-cache-correctness e2e-test-virtual-resolution"
          fi
          docker compose -f docker-compose.test.yml --profile all --profile "$profile" config --format json > validation-base.json
          PROFILE="$profile" python3 - <<'CONFIG'
        import json,os
        from pathlib import Path
        cfg=json.loads(Path('validation-base.json').read_text())
        backend=cfg['services']['backend']
        backend.pop('build',None)
        backend['ports']=[{'target':8080,'published':'18080','host_ip':'127.0.0.1','protocol':'tcp'}]
        for name,net in list(backend['networks'].items()):
            if not isinstance(net,dict): net={}
            net.setdefault('aliases',[]).append('backend.test')
            backend['networks'][name]=net
        for name,svc in cfg['services'].items():
            if name.endswith('-test'):
                env=svc.setdefault('environment',{})
                for key in ('ADMIN_PASS','ADMIN_PASSWORD','AK_TEST_ADMIN_PASSWORD'):
                    env[key]=os.environ[key]
                if isinstance(env.get('REGISTRY_URL'),str):
                    env['REGISTRY_URL']=env['REGISTRY_URL'].replace('http://backend:8080','http://backend.test:8080')
        for name in ('protobuf-test','hex-test'):
            cfg['services'][name]['command']=['sh','-c',f'apk add --no-cache bash curl jq tar coreutils python3 openssl perl-utils >/dev/null 2>&1 && bash /scripts/test-{name[:-5]}.sh']
        cfg['services']['tag-replication-test']['command']=['bash','-c','apt-get update -qq && apt-get install -y -qq --no-install-recommends curl >/dev/null && bash /scripts/test-tag-replication.sh']
        cfg['services']['conda-test']['environment']['BACKEND_URL']='http://backend.test:8080'
        cfg['services']['conda-test']['environment']['AUTH_USER']='admin'
        cfg['services']['conda-test']['environment']['AUTH_PASS']=os.environ['ADMIN_PASS']
        cfg['services']['conda-test']['command']=['bash','-c','apt-get update -qq && apt-get install -y -qq --no-install-recommends curl jq zip unzip bzip2 zstd >/dev/null && bash /scripts/test-conda.sh']
        cfg['services']['maven-test']['environment']['REGISTRY_URL']='http://backend.test:8080/maven/test-maven'
        cfg['services']['maven-test']['environment']['REGISTRY_USER']='admin'
        cfg['services']['maven-test']['environment']['REGISTRY_PASS']=os.environ['ADMIN_PASS']
        if 'mock-upstream' in cfg['services']:
            cfg['services']['mock-upstream']['healthcheck']['test']=['CMD','wget','-q','--spider','http://127.0.0.1/rpm/repodata/repomd.xml']
        Path('validation-compose.json').write_text(json.dumps(cfg))
        CONFIG
          if [ "$profile" = hex ]; then
            docker compose -f validation-compose.json up -d --no-build --wait --wait-timeout 180 setup > validation-reports/hex-fixture-start.log 2>&1
            python3 - <<'HEXFIXTURE'
        import json,os,urllib.request
        base='http://127.0.0.1:18080'
        r=urllib.request.Request(base+'/api/v1/auth/login',data=json.dumps({'username':'admin','password':os.environ['ADMIN_PASS']}).encode(),headers={'Content-Type':'application/json'})
        with urllib.request.urlopen(r,timeout=20) as f: token=json.load(f)['access_token']
        r=urllib.request.Request(base+'/api/v1/repositories',data=json.dumps({'key':'test-hex','name':'Hex synthetic fixture','format':'hex','repo_type':'local','is_public':True}).encode(),headers={'Content-Type':'application/json','Authorization':'Bearer '+token})
        with urllib.request.urlopen(r,timeout=20) as f: assert 200<=f.status<300
        print('Created missing Hex repository fixture')
        HEXFIXTURE
          fi
          if [ "$profile" = cache-correctness ]; then
            docker compose -f validation-compose.json build cache-mock-upstream > validation-reports/cache-mock-build.log 2>&1
          fi
          if [ "$profile" = docker ]; then
            if docker compose -f validation-compose.json up -d --no-build --wait --wait-timeout 180 trivy setup pki > validation-reports/docker-start.log 2>&1 && REGISTRY_URL=localhost:18080 REGISTRY_PASS="$ADMIN_PASS" CA_CERT="$PWD/.pki/ca.crt" bash scripts/native-tests/test-docker.sh > validation-reports/docker-host.log 2>&1; then
              echo 'docker: host Docker CLI suite passed' | tee -a validation-reports/results.txt
            else
              echo 'docker: host Docker CLI suite failed' | tee -a validation-reports/results.txt; failed=1
            fi
          elif docker compose -f validation-compose.json up -d --no-build trivy $targets > "validation-reports/$profile-start.log" 2>&1; then
            if ! timeout 1000 docker wait $containers > "validation-reports/$profile-wait.log" 2>&1; then failed=1; fi
            for container in $containers; do
              docker logs "$container" > "validation-reports/$container.log" 2>&1 || true
              state=$(docker inspect --format '{{.State.Status}} {{.State.ExitCode}} {{.State.OOMKilled}}' "$container" 2>/dev/null || echo missing)
              echo "$profile: $container: $state" | tee -a validation-reports/results.txt
              if [ "$state" != 'exited 0 false' ]; then failed=1; fi
            done
          else
            echo "$profile: SETUP FAILED" | tee -a validation-reports/results.txt; failed=1
          fi
          docker compose -f validation-compose.json logs --no-color > "validation-reports/$profile-stack.log" 2>&1 || true
          docker compose -f validation-compose.json down -v --remove-orphans > "validation-reports/$profile-cleanup.log" 2>&1
         done
        cat validation-reports/results.txt >> "$GITHUB_STEP_SUMMARY"
        exit "$failed"
    - name: Concurrent transfers and failure recovery
      if: matrix.profiles == 'recovery'
      run: |
        set -euo pipefail
        mkdir -p validation-reports
        cat > validation-ports.json <<'JSON'
        {"services":{"backend":{"ports":["127.0.0.1:18080:8080"]}}}
        JSON
        export COMPOSE_FILE=docker-compose.test.yml:validation-ports.json
        set -a
        . ./.env.test
        set +a
        docker compose up -d --wait --wait-timeout 180 postgres backend
        cat > validation-recovery.py <<'PYTHON'
        import concurrent.futures as cf
        import hashlib, json, os, random, subprocess, time, urllib.request, urllib.error
        BASE='http://127.0.0.1:18080'
        token=None

        def api(method, path, body=None, timeout=20):
            headers={}
            if token: headers['Authorization']='Bearer '+token
            if isinstance(body, dict):
                body=json.dumps(body).encode(); headers['Content-Type']='application/json'
            elif body is not None: headers['Content-Type']='application/octet-stream'
            request=urllib.request.Request(BASE+path, data=body, method=method, headers=headers)
            deadline=time.monotonic()+180
            while True:
                try:
                    with urllib.request.urlopen(request, timeout=timeout) as r: return r.status,r.read()
                except urllib.error.HTTPError as e:
                    if e.code!=429 or time.monotonic()>=deadline: return e.code,e.read()
                    retry=e.headers.get('Retry-After','1')
                    try: delay=max(1.0,float(retry))
                    except ValueError: delay=1.0
                    time.sleep(min(delay,30)+random.uniform(0,0.5))

        def compose(*args):
            subprocess.run(['docker','compose',*args],check=True,stdout=subprocess.DEVNULL)

        def ready():
            for _ in range(60):
                try:
                    code,_=api('GET','/health',timeout=2)
                    if code==200: return
                except (OSError,TimeoutError): pass
                time.sleep(2)
            raise AssertionError('backend recovery timeout')

        ready()
        code,data=api('POST','/api/v1/auth/login',{'username':'admin','password':os.environ['ADMIN_PASS']})
        assert code==200,('login status',code)
        token=json.loads(data)['access_token']
        repo='ca-validation-recovery'
        code,_=api('POST','/api/v1/repositories',{'key':repo,'name':'Synthetic validation','format':'generic','repo_type':'local','is_public':False})
        assert 200<=code<300,('repository creation status',code)
        path='/api/v1/repositories/'+repo+'/artifacts/'

        def transfer(i):
            payload=hashlib.sha256(str(i).encode()).digest()*2048
            key=path+str(i)+'.bin'
            code,_=api('PUT',key,payload)
            assert 200<=code<300,('upload',i,code)
            code,actual=api('GET','/api/v1/repositories/'+repo+'/download/'+str(i)+'.bin')
            assert code==200 and actual==payload,('download/checksum',i,code)
            return i

        with cf.ThreadPoolExecutor(max_workers=20) as pool:
            assert len(list(pool.map(transfer,range(100))))==100
        print('PASS: 100 uploads/downloads at concurrency 20, every byte verified; bounded HTTP 429 retries respected',flush=True)
        compose('kill','backend')
        compose('up','-d','backend')
        ready(); transfer(101)
        print('PASS: backend kill/restart preserves existing and accepts new artifacts',flush=True)
        code,data=api('GET','/api/v1/repositories/'+repo+'/download/0.bin')
        assert code==200 and data==hashlib.sha256(b'0').digest()*2048
        compose('stop','postgres')
        try:
            code,_=api('PUT',path+'db-offline.bin',b'database outage probe',timeout=45)
            assert 500<=code<600,('database outage status',code)
        finally: compose('start','postgres')
        for _ in range(60):
            try:
                transfer(102); break
            except (AssertionError,OSError,TimeoutError): time.sleep(2)
        else: raise AssertionError('database recovery timeout')
        print('PASS: database outage fails the write and recovers after restart',flush=True)
        compose('exec','-T','--user','root','backend','chmod','-R','a-w','/data/storage')
        try:
            code,_=api('PUT',path+'storage-readonly.bin',b'unique storage failure probe')
            assert 500<=code<600,('storage failure status',code)
        finally: compose('exec','-T','--user','root','backend','chmod','-R','u+rwX','/data/storage')
        transfer(103)
        print('PASS: denied storage write returns server error and recovers',flush=True)
        PYTHON
        python3 validation-recovery.py | tee validation-reports/recovery-results.txt
        cat validation-reports/recovery-results.txt >> "$GITHUB_STEP_SUMMARY"
    - name: Collect backend diagnostics
      if: always()
      run: |
        mkdir -p validation-reports
        docker logs e2e-test-backend > validation-reports/backend-final.log 2>&1 || true
        docker ps -a > validation-reports/containers.txt
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: extra-${{ strategy.job-index }}
        path: validation-reports
        retention-days: 7
    - name: Clean disposable stack
      if: always()
      run: |
        if [ -f validation-compose.json ]; then docker compose -f validation-compose.json down -v --remove-orphans; else docker compose -f docker-compose.test.yml --profile all down -v --remove-orphans; fi
