        \ 2>/dev/null\n-    if conda search \"e2e-v1-pkg\" 2>&1 | grep -q \"e2e-v1-pkg\"; then\n-        pass \"11.5: .condarc\
        \ channel URL format works (global config)\"\n-    else\n-        fail \"11.5: .condarc channel URL format failed\"\
        \n-    fi\n+    fail \"11.5: .condarc channel URL format failed\"\n fi\n \n # mamba (if available)\n@@ -739,14 +749,14\
