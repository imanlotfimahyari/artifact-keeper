        ${1:-scripts/native-tests/fixtures/curation/rpm/repodata}\"\n+fixture_key=\"${2:-.pki/gpg-signing.key}\"\n+export\
        \ GNUPGHOME=\"$(mktemp -d)\"\n+chmod 700 \"$GNUPGHOME\"\n+trap 'gpgconf --kill gpg-agent 2>/dev/null || true; rm -rf\
        \ \"$GNUPGHOME\"' EXIT\n+gpg --batch --import \"$fixture_key\"\n+fixture_fingerprint=$(gpg --batch --with-colons --list-keys\
        \ | awk -F: '$1 == \"fpr\" {print $10; exit}')\n+[ -n \"$fixture_fingerprint\" ]\n+python3 - \"$fixture_dir\" <<'PY'\n\
        +from pathlib import Path\n+import hashlib\n+import sys\n+path = Path(sys.argv[1])\n+body = (path / 'primary.xml.gz').read_bytes()\n\
        +(path / 'repomd.xml').write_text(\n+    '<repomd xmlns=\"http://linux.duke.edu/metadata/repo\"><data type=\"primary\"\
        >'\n+    '<location href=\"repodata/primary.xml.gz\"/><checksum type=\"sha256\">'\n+    + hashlib.sha256(body).hexdigest()\
        \ + '</checksum><size>' + str(len(body))\n+    + '</size></data></repomd>')\n+PY\n+gpg --batch --yes --local-user\
        \ \"$fixture_fingerprint!\" --armor --detach-sign \"$fixture_dir/repomd.xml\"\n+gpg --batch --verify \"$fixture_dir/repomd.xml.asc\"\
        \ \"$fixture_dir/repomd.xml\"\ndiff --git a/scripts/native-tests/test-conda.sh b/scripts/native-tests/test-conda.sh\n\
        index 7c4ab547..30c5e4c9 100755\n--- a/scripts/native-tests/test-conda.sh\n+++ b/scripts/native-tests/test-conda.sh\n\
        @@ -19,6 +19,23 @@ skip() { echo \"  SKIP: $*\"; SKIP=$((SKIP + 1)); }\n WORK_DIR=\"$(mktemp -d)\"\n trap 'rm -rf\
