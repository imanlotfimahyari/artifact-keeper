name: Conda native compatibility and retained-database upgrade v2
'on':
  push:
    branches:
    - validation/5194-extra-hosted
    paths:
    - .github/workflows/ca-validation-extra.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: ca-5194-native-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  native:
    name: Conda 26.7 compatibility and database upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - mode: conda-fix
          profile: conda
          image_repo: imanlotfimahyari/artifact-keeper
          image_run: 42080768395
          product_sha: 70bebdc54a7ed50c9c86a9015f19d6439f6634ef
    env:
      PROFILE: ${{ matrix.profile }}
      MODE: ${{ matrix.mode }}
      PRODUCT_SHA: ${{ matrix.product_sha }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 3f72c6e2589c95dfa422a76483fcab9ee1b49c50
        persist-credentials: false
